name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Installs every workspace; the backend postinstall generates the Prisma client.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      # Tests build their own SQLite database from database/migrations — no secrets needed.
      - run: npm test
      - run: npm run build
